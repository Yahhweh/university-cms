<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{styles/css.html :: my-css}">
    <meta charset="UTF-8">
    <title>My Schedule</title>
</head>
<body class="py-4">
<div class="container">
    <h4 class="text-white mb-4">My Schedule</h4>

    <div class="d-flex gap-2 mb-4">
        <a th:href="@{/lecturers/my-schedule(startDate=${weekBegin},endDate=${weekEnd})}"
           th:class="${startDate == weekBegin and endDate == weekEnd} ? 'btn btn-primary btn-sm' : 'btn btn-outline-light btn-sm'">This week</a>
        <a th:href="@{/lecturers/my-schedule(startDate=${monthBegin},endDate=${monthEnd})}"
           th:class="${startDate == monthBegin and endDate == monthEnd} ? 'btn btn-primary btn-sm' : 'btn btn-outline-light btn-sm'">This month</a>
    </div>

    <p th:if="${lessonsByDay.isEmpty()}" class="text-muted">No lessons found for
        the selected period.</p>

    <div th:if="${!lessonsByDay.isEmpty()}">
        <div th:each="entry : ${lessonsByDay}" class="mb-4">
            <h5 class="text-white mb-2" th:text="${entry.key}">MONDAY</h5>
            <div class="table-responsive">
                <table
                    class="table table-bordered table-striped table-hover bg-white">
                    <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Subject</th>
                        <th>Duration</th>
                        <th>Room</th>
                        <th>Group</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="lesson : ${entry.value}">
                        <td th:text="${#temporals.format(lesson.date, 'dd.MM.yyyy')}"></td>
                        <td th:text="${lesson.subject}"></td>
                        <td th:text="${lesson.duration}"></td>
                        <td th:text="${lesson.room}"></td>
                        <td th:text="${lesson.group}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
