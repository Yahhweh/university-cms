<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{styles/css.html :: my-css}">
    <meta charset="UTF-8">
    <title>Schedule Setup</title>
    <style>
        .idance .timetable-item {
            border: 1px solid #d8e3eb;
            padding: 15px;
            margin-top: 20px;
            position: relative;
            display: block;
        }
        @media (min-width: 768px) {
            .idance .timetable-item {
                display: -webkit-box;
                display: -ms-flexbox;
                display: flex;
            }
        }
        .idance .timetable-item-main {
            -webkit-box-flex: 1;
            -ms-flex: 1;
            flex: 1;
            position: relative;
            margin-top: 12px;
        }
        @media (min-width: 768px) {
            .idance .timetable-item-main {
                margin-top: 0;
            }
        }
        .idance .timetable-item-time {
            font-weight: 500;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .idance .timetable-item-name {
            font-size: 14px;
            margin-bottom: 8px;
        }
        .idance .schedule .nav-tabs {
            border-bottom: 2px solid #104455;
        }
        .idance .schedule .nav-link {
            -webkit-box-flex: 1;
            -ms-flex: 1;
            flex: 1;
            font-size: 12px;
            text-align: center;
            text-transform: uppercase;
            color: #3d3d3d;
            font-weight: 500;
            -webkit-transition: none;
            -o-transition: none;
            transition: none;
            border-radius: 2px 2px 0 0;
            padding-left: 0;
            padding-right: 0;
            cursor: pointer;
        }
        @media (min-width: 768px) {
            .idance .schedule .nav-link {
                font-size: 16px;
            }
        }
        .idance .schedule .nav-link.active {
            background: #104455;
            border-color: #104455;
            color: #fff;
        }
        .idance .schedule .nav-link.active:focus {
            border-color: #104455;
        }
        .idance .schedule .nav-link:hover:not(.active) {
            background: #46c1be;
            border-color: #46c1be;
            color: #fff;
        }
        .idance .schedule .tab-pane {
            padding-top: 10px;
        }
    </style>
</head>
<body class="py-4">
<div th:if="${successMessage}"
     th:insert="~{toasts/success-toast :: success-toast(${successMessage})}"></div>
<div th:if="${errorMessage}"
     th:insert="~{toasts/error-toast :: error-toast(${errorMessage})}"></div>

<div class="container idance">

    <h4 class="text-white mb-4">
        <i class="bi bi-calendar3 me-2"></i>Schedule Setup
    </h4>

    <form th:action="@{/users/schedule-setup}" method="get"
          class="d-flex gap-3 align-items-center mb-4">
        <label class="form-label mb-0 fw-bold text-white">Group:</label>
        <select name="groupId" class="form-select w-auto">
            <option value="" disabled th:selected="${selectedGroupId == null}">Select group</option>
            <option th:each="g : ${groups}" th:value="${g.id}"
                    th:text="${g.name}"
                    th:selected="${g.id == selectedGroupId}"></option>
        </select>
        <button type="submit" class="btn btn-primary btn-sm">Show</button>
    </form>

    <p th:if="${selectedGroupId == null}" class="text-white-50 fst-italic">
        <i class="bi bi-info-circle me-1"></i>Select a group to view its schedule.
    </p>

    <div th:if="${lessonsByDay != null}" class="schedule">

        <nav class="nav nav-tabs">
            <a th:each="entry, stat : ${lessonsByDay}"
               class="nav-link"
               th:classappend="${stat.first} ? ' active'"
               th:href="'#tab-' + ${stat.index}"
               th:attr="data-bs-toggle='tab'"
               th:text="${entry.key}">Mon</a>
        </nav>

        <div class="tab-content bg-white px-3 pb-3">
            <div th:each="entry, stat : ${lessonsByDay}"
                 class="tab-pane"
                 th:classappend="${stat.first} ? ' show active'"
                 th:id="'tab-' + ${stat.index}">

                <p th:if="${entry.value.isEmpty()}" class="text-muted fst-italic pt-3">No lessons this day.</p>

                <div class="row">
                    <div th:each="s : ${entry.value}" class="col-md-6">
                        <div class="timetable-item">
                            <div class="timetable-item-main">
                                <div class="timetable-item-time">
                                    <i class="bi bi-clock me-1"></i>
                                    <span th:text="${s.duration}"></span>
                                </div>
                                <div class="timetable-item-name fw-semibold" th:text="${s.subject}"></div>
                                <div class="text-muted small">
                                    <i class="bi bi-person me-1"></i>
                                    <span th:text="${s.lecturer}"></span>
                                </div>
                            </div>
                            <div class="d-flex align-items-center ms-3">
                                <form th:action="@{/lessons/delete-lesson(url = ${url})}" method="post">
                                    <input type="hidden" name="lessonId" th:value="${s.id}"/>
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-link p-0 text-danger" title="Delete lesson">
                                        <i class="bi bi-trash fs-5"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

</div>
</body>
</html>
