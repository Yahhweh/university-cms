<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{styles/css.html :: my-css}">
    <meta charset="UTF-8">
    <title>Schedule Setup</title>
</head>
<body class="py-4">
<div th:if="${successMessage}"
     th:insert="~{toasts/success-toast :: success-toast(${successMessage})}"></div>
<div th:if="${errorMessage}"
     th:insert="~{toasts/error-toast :: error-toast(${errorMessage})}"></div>
<div class="container">
    <form th:action="@{/users/schedule-setup}" method="get"
          class="d-flex gap-3 align-items-center mb-4">
        <label class="form-label mb-0 fw-bold">Group:</label>
        <select name="groupId" class="form-select w-auto">
            <option value="" disabled th:selected="${selectedGroupId == null}">
                Select group
            </option>
            <option th:each="g : ${groups}" th:value="${g.id}"
                    th:text="${g.name}"
                    th:selected="${g.id == selectedGroupId}"></option>
        </select>
        <button type="submit" class="btn btn-primary btn-sm">Show</button>
    </form>

    <p th:if="${selectedGroupId == null}" class="text-muted">Select a group to
        view its schedule.</p>

    <div th:if="${lessonsByDay != null}">
        <div th:each="entry : ${lessonsByDay}" class="mb-4">
            <h5 class="text-white mb-2" th:text="${entry.key}">MONDAY</h5>
            <div class="table-responsive">
                <table
                    class="table table-bordered table-striped table-hover bg-white">
                    <thead class="table-dark">
                    <tr>
                        <th>Subject</th>
                        <th>Duration</th>
                        <th>Lecturer</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${entry.value}">
                        <td th:text="${s.subject}"></td>
                        <td th:text="${s.duration}"></td>
                        <td th:text="${s.lecturer}"></td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <form th:action="@{/lessons/delete-lesson(url = ${url})}"
                                      method="post">
                                    <input type="hidden" name="lessonId"
                                           th:value="${s.id}"/>
                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}"/>
                                    <button type="submit"
                                            class="btn btn-link p-0 text-danger"
                                            title="Delete lesson">
                                        <i class="bi bi-trash fs-5"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
