<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="styles/css.html :: my-css">
    <meta charset="UTF-8">
    <title>Create Schedule</title>
</head>
<body class="py-5">
<div th:if="${successMessage}"
     th:insert="~{toasts/success-toast :: success-toast(${successMessage})}"
     class="py-4"></div>
<div th:if="${errorMessage}"
     th:insert="~{toasts/error-toast :: error-toast(${errorMessage})}"
     class="py-4"></div>
<div class="container">
    <div class="card shadow mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white">
            <h1 class="h3 mb-0">Create Schedule</h1>
        </div>
        <div class="card-body">

            <form th:action="@{/schedules/create-schedule}" method="get">
                <input type="hidden" th:if="${presetDay != null}" name="day"
                       th:value="${presetDay}"/>

                <div class="mb-3">
                    <label class="form-label">Group</label>
                    <select name="groupId" required class="form-select">
                        <option value="" disabled
                                th:selected="${groupId == null}">Select group
                        </option>
                        <option th:each="group : ${groups}"
                                th:value="${group.id}"
                                th:text="${group.name}"
                                th:selected="${group.id == groupId}"></option>
                    </select>
                </div>

                <div class="mb-3" th:if="${groupId != null}">
                    <label class="form-label">Subject</label>
                    <select name="subjectId" required class="form-select">
                        <option value="" disabled
                                th:selected="${subjectId == null}">Select
                            subject
                        </option>
                        <option th:each="subject : ${subjects}"
                                th:value="${subject.id}"
                                th:text="${subject.name}"
                                th:selected="${subject.id == subjectId}"></option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary mb-3">Select
                </button>
            </form>

            <div th:if="${groupId != null and subjectId != null}">
                <hr>
                <form method="post" th:action="@{/schedules}">
                    <input type="hidden" name="groupId" th:value="${groupId}"/>
                    <input type="hidden" name="subjectId"
                           th:value="${subjectId}"/>
                    <input type="hidden" th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label class="form-label">Day</label>
                        <div th:if="${presetDay != null}">
                            <p class="form-control-plaintext fw-bold"
                               th:text="${presetDay}"></p>
                            <input type="hidden" name="day"
                                   th:value="${presetDay}"/>
                        </div>
                        <select th:if="${presetDay == null}" name="day" required
                                class="form-select">
                            <option value="" disabled selected>Select day
                            </option>
                            <option th:each="day : ${days}"
                                    th:value="${day}"
                                    th:text="${day}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Duration</label>
                        <select name="durationId" required class="form-select">
                            <option value="" disabled selected>Select duration
                            </option>
                            <option th:each="duration : ${durations}"
                                    th:value="${duration.id}"
                                    th:text="${duration.start} + ' - ' + ${duration.end}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Lecturer</label>
                        <select name="lecturerId" required class="form-select">
                            <option value="" disabled selected>Select lecturer
                            </option>
                            <option th:each="lecturer : ${lecturers}"
                                    th:value="${lecturer.id}"
                                    th:text="${lecturer.name} + ' ' + ${lecturer.sureName}"></option>
                        </select>
                    </div>

                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary">Create
                            Schedule
                        </button>
                        <a th:href="@{/schedules/schedule-setup}"
                           class="btn btn-secondary">Back</a>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
</body>
</html>
